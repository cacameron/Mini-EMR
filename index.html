<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini EMR Login</title>
    <style>
        /* ------------------ GLOBAL STYLES ------------------ */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f0fe, #cfd9ff);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ------------------ CONTAINER FOR LOGIN BOX ------------------ */
        .container {
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* ------------------ HEADER TITLE ------------------ */
        h2 {
            color: #1a237e;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* ------------------ LOGIN BUTTONS ------------------ */
        .login-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .login-buttons a {
            text-decoration: none;
            background-color: #1a73e8;
            color: white;
            padding: 12px 0;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
        }

        .login-buttons a:hover {
            background-color: #155ab6;
            transform: translateY(-2px);
        }

        /* ------------------ FOOTER ------------------ */
        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome to Mini EMR</h2>
        <div class="login-buttons">
            <a href="{{ url_for('patient_login') }}">Patient Login</a>
            <a href="{{ url_for('doctor_login') }}">Doctor Login</a>
            <a href="{{ url_for('nurse_login') }}">Nurse Login</a>
        </div>
        <footer>© 2025 Mini EMR. All rights reserved.</footer>
    </div>
</body>
</html>
