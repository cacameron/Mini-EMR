<!-- Nurse Login Screen -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nurse Login – Mini EMR</title>

<style>
/* --- General Page Styling --- */
body {
    font-family: 'Segoe UI', Roboto, sans-serif;
    background-color: #e8f0fe;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

/* --- Login Container --- */
.login-container {
    background-color: white;
    border: 3px solid #0a66c2;
    border-radius: 16px;
    padding: 40px 50px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    text-align: center;
    width: 350px;
}

/* --- Header Title --- */
.login-container h2 {
    color: #0a66c2;
    margin-bottom: 25px;
    font-size: 26px;
}

/* --- Input Labels --- */
label {
    display: block;
    text-align: left;
    color: #333;
    font-weight: 600;
    margin-bottom: 8px;
}

/* --- Input Fields --- */
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 20px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    box-sizing: border-box;
}

/* --- Login Button --- */
button {
    width: 100%;
    padding: 12px;
    background-color: #0a66c2;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s ease;
}
button:hover {
    background-color: #004b99;
}

/* --- Error Message --- */
#error-message {
    color: red;
    margin-top: 15px;
    font-weight: 500;
}

/* --- Create Account Link --- */
.create-account {
    margin-top: 20px;
    font-size: 14px;
}

.create-account a {
    color: #0a66c2;
    text-decoration: none;
    font-weight: 600;
}

.create-account a:hover {
    text-decoration: underline;
}

/* --- Back to Home Button --- */
.back-button {
    margin-top: 15px;
    display: block;
    background-color: #f0f0f0;
    color: #0a66c2;
    text-decoration: none;
    border: 2px solid #0a66c2;
    padding: 10px 0;
    border-radius: 8px;
    font-weight: 600;
    transition: all 0.2s ease;
}
.back-button:hover {
    background-color: #0a66c2;
    color: white;
}
</style>
</head>

<body>
<div class="login-container">
    <h2>Nurse Login</h2>

    <!-- Error Display -->
    {% if error %}
        <p id="error-message">{{ error }}</p>
    {% endif %}

    <!-- Login Form -->
    <form action="{{ url_for('nurse_login') }}" method="POST">
        <label for="nid">Nurse ID:</label>
        <input type="text" id="nid" name="nid" placeholder="Enter your Nurse ID" required>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your Password" required>

        <button type="submit">Login</button>
    </form>

    <!-- Registration Link -->
    <div class="create-account">
        <p>Don’t have an account?
            <a href="{{ url_for('nurse_register') }}">Create one here</a>
        </p>
    </div>

    <!-- Back Button -->
    <a href="{{ url_for('index') }}" class="back-button">← Back to Home</a>
</div>
</body>
</html>
