<!-- NurseLogin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Ensure responsiveness on all screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Page title -->
    <title>Nurse Login – Mini EMR</title>

    <style>
        /* ------------------ GLOBAL STYLES ------------------ */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f0fe, #cfd9ff);
            height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ------------------ MAIN CONTAINER ------------------ */
        .container {
            background-color: #fff;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        /* ------------------ HEADER ------------------ */
        h2 {
            color: #1a237e;
            margin-bottom: 25px;
            font-size: 26px;
        }

        /* ------------------ FORM ------------------ */
        form {
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
        }

        /* ------------------ INPUT FIELDS ------------------ */
        input {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        /* ------------------ BUTTON ------------------ */
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 0;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease-in-out;
            margin-top: 5px;
        }

        button:hover {
            background-color: #155ab6;
            transform: translateY(-2px);
        }

        /* ------------------ LINKS ------------------ */
        .link {
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .link a {
            color: #1a73e8;
            text-decoration: none;
            font-weight: 600;
        }

        .link a:hover {
            text-decoration: underline;
        }

        /* ------------------ ERROR MESSAGE ------------------ */
        .error {
            color: red;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        /* ------------------ FOOTER ------------------ */
        footer {
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Title -->
        <h2>Nurse Login</h2>

        <!-- Error message if login fails -->
        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <!-- Nurse login form -->
        <form method="POST" action="{{ url_for('nurse_login') }}">
            <input type="text" name="nid" placeholder="Enter your Nurse ID" required />
            <input type="password" name="password" placeholder="Enter your Password" required />
            <button type="submit">Login</button>
        </form>

        <!-- Links below form -->
        <div class="link">
            <p>
                Don’t have an account? 
                <a href="{{ url_for('nurse_register') }}">Create one here</a>
            </p>
            <p>
                Return to <a href="{{ url_for('index') }}">Main login page</a>
            </p>
        </div>

        <!-- Footer -->
        <footer>© 2025 Mini EMR. All rights reserved.</footer>
    </div>
</body>
</html>
