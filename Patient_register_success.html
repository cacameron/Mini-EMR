<!-- Patient Registration Success Page -->
<!-- 
Displays confirmation for the newly registered patient.
Shows automatically assigned doctor information.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini EMR – Registration Success</title>
    <link rel="stylesheet" href="style.css" />

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e8f0fe;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #0056b3;
        }

        p {
            font-size: 16px;
            color: #333;
        }

        .highlight {
            font-weight: bold;
            color: #0056b3;
        }

        a.button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #0056b3;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a.button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registration Successful!</h1>
        <p>Welcome, <span class="highlight">{{ first_name }} {{ last_name }}</span></p>
        <p>Your Patient ID is: <span class="highlight">{{ opid }}</span></p>
        <p>Your assigned doctor is: <span class="highlight">{{ doctor_name }}</span></p>

        <a class="button" href="{{ url_for('patient_login') }}">Go to Login</a>
    </div>
</body>
</html>
