<!--Doctor_register_success-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- Ensures responsive layout for all device sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Browser tab title -->
    <title>Registration Successful – Mini EMR</title>

    <style>
        /* ------------------ GLOBAL STYLES ------------------ */
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #e8f0fe, #cfd9ff); 
            height: 100vh;
            margin: 0;
            display: flex;               
            justify-content: center;
            align-items: center;
        }

        /* ------------------ MAIN CONTAINER ------------------ */
        .container {
            background-color: #fff;     
            padding: 40px 60px;
            border-radius: 20px;         
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1); 
            text-align: center;
            max-width: 420px;            
            width: 90%;
        }

        /* ------------------ HEADER ------------------ */
        h2 {
            color: #1a237e;              
            margin-bottom: 20px;
            font-size: 26px;
        }

        /* ------------------ PARAGRAPH TEXT ------------------ */
        p {
            font-size: 1rem;
            color: #333;                 
            margin: 10px 0;
        }

        /* ------------------ UNIQUE OPID DISPLAY BOX ------------------ */
        .opid {
            background: #f1f5ff;         
            border: 1px solid #1a73e8;   
            padding: 0.7rem 1rem;
            border-radius: 10px;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
            color: #1a237e;
        }

        /* ------------------ LINK STYLE ------------------ */
        a {
            color: #1a73e8;              
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 15px;
            transition: all 0.2s ease-in-out;
        }

        /* Hover animation for link */
        a:hover {
            text-decoration: underline;
            transform: translateY(-1px); 
        }

        /* ------------------ FOOTER ------------------ */
        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;                 
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Heading with a small celebratory emoji -->
        <h2>Registration Successful 🎉</h2>

        <!-- Personalized welcome message using Flask variables -->
        <p>Welcome, {{ first_name }} {{ last_name }}!</p>

        <!-- Display of the doctor’s assigned unique ID -->
        <p>Your unique OPID is:</p>
        <div class="opid">{{ opid }}</div>

        <!-- Instruction to remind the user to keep their ID -->
        <p>Please save this ID — you’ll need it to log in.</p>

        <!-- Backup manual link in case the redirect fails -->
        <a href="{{ url_for('doctor_login') }}">Go back to login page</a>

        <!-- Footer credit -->
        <footer>© 2025 Mini EMR. All rights reserved.</footer>
    </div>
</body>
</html>
